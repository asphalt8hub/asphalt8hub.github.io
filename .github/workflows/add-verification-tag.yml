name: Add GSC verification tag (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Google site verification meta tag
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("index.html")
          text = p.read_text(encoding="utf-8")
          tag = '<meta name="google-site-verification" content="HoWofmErOOKMSn8dHeXvBTb5cGoEBEB1rQ7Y3CrUYgY" />'
          if tag in text:
              print("Tag already present; no change.")
          else:
              anchor = '<meta charset="utf-8" />'
              assert anchor in text, "charset anchor not found"
              text = text.replace(anchor, anchor + "\n" + tag, 1)
              p.write_text(text, encoding="utf-8")
              print("Tag inserted after charset meta.")
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Google Search Console verification meta tag"
          git push
